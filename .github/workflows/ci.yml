name: CI

# Gates for the plugin + the templates that scaffold OTHER workspaces.
# The governor auto-merges this repo's PRs on a "green-or-no-checks" rule, so
# without a PR-level check every PR merges on "no-checks" = always-mergeable,
# with the worker's self-reported `bash -n` as the only (unenforced) verification.
# This workflow turns that into a real green gate: (1) every shell script must
# parse; (2) no leftover conflict markers; (3) plugin + marketplace manifests
# are valid JSON with required fields; (4) scaffold.sh + the full govern
# test suite run green in a throwaway workspace on every PR; (5) the
# purge/seed-hash manifests that make "update pulls everything" true stay
# honest — a deleted template must be purge-able, a shipped seed must be
# upgradable.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-templates:
    name: Lint shell templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Blocking gate #1: every shell script must parse ---
      - name: bash -n (syntax check every shell script)
        run: |
          set -uo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found — nothing to check"
            exit 0
          fi
          fail=0
          for f in "${scripts[@]}"; do
            if bash -n "$f" 2>/tmp/bashn.err; then
              echo "ok   - $f"
            else
              echo "FAIL - $f"
              sed 's/^/         /' /tmp/bashn.err
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more shell scripts have a syntax error"
            exit 1
          fi

      # --- Blocking gate #2: no leftover merge-conflict markers ---
      - name: Conflict-marker scan
        run: |
          set -uo pipefail
          # Git writes these exact markers; any one at line-start = an unresolved conflict.
          # Require the marker to be followed by a space (branch name) or end-of-line so
          # decorative rules of <, =, > don't false-positive. Exclude this workflow itself.
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Leftover git conflict markers found (see matches above)"
            exit 1
          fi
          echo "ok - no conflict markers"

      # --- Advisory only: surface shellcheck findings, never block the gate ---
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          set -uo pipefail
          # shellcheck ships on the ubuntu-latest image; only pay for apt if it is missing.
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S warning "${scripts[@]}" || true

  validate-manifests:
    name: Validate plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq empty on .claude-plugin/*.json
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if [ ! -f "$f" ]; then
              echo "::error::missing manifest: $f"; exit 1
            fi
            if ! jq empty "$f" >/dev/null; then
              echo "::error::invalid JSON: $f"; exit 1
            fi
            echo "ok - $f"
          done
      - name: assert plugin.json required fields
        run: |
          set -euo pipefail
          name=$(jq -r '.name // ""' .claude-plugin/plugin.json)
          version=$(jq -r '.version // ""' .claude-plugin/plugin.json)
          [ -n "$name" ] || { echo "::error::plugin.json missing name"; exit 1; }
          [ -n "$version" ] || { echo "::error::plugin.json missing version"; exit 1; }
          echo "ok - name=$name version=$version"
      - name: assert marketplace.json required fields
        run: |
          set -euo pipefail
          m_name=$(jq -r '.name // ""' .claude-plugin/marketplace.json)
          plugins=$(jq '.plugins | length' .claude-plugin/marketplace.json)
          [ -n "$m_name" ] || { echo "::error::marketplace.json missing name"; exit 1; }
          [ "$plugins" -ge 1 ] || { echo "::error::marketplace.json has no plugins"; exit 1; }
          # Assert every plugin entry has name + source.
          bad=$(jq -r '.plugins[] | select((.name // "") == "" or (.source // "") == "") | .name // "<unnamed>"' \
            .claude-plugin/marketplace.json)
          if [ -n "$bad" ]; then
            echo "::error::marketplace plugin entries missing name or source: $bad"
            exit 1
          fi
          echo "ok - marketplace=$m_name plugins=$plugins"

  check-manifests:
    name: Manifest guards (purge-manifest-complete + seed-hashes-current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch main (base for the templates/** deletion diff)
        run: git fetch origin main 2>/dev/null || true
      - name: run tools/check-manifests.sh
        run: bash tools/check-manifests.sh

  hub-context-tests:
    name: Update-channel tests (run from the hub checkout, not a workspace)
    runs-on: ubuntu-latest
    # These tests assert on the hub itself — scaffold.sh, templates/, VERSION, purge.txt,
    # seed-hashes.txt — so they resolve HUB as $DIR/../../.. and exit 77 ("skip") when that
    # is not a hub checkout. `scaffold-and-test` COPIES the suite into a throwaway workspace,
    # where that path is the workspace root, so every one of them has been silently skipping
    # there: the entire update channel (purge, reconcile, converge) was ungated in CI. Run
    # them from the checkout, where the path resolves, and treat a skip as a FAILURE — a
    # skip here means the resolution broke, which is exactly the regression worth catching.
    steps:
      - uses: actions/checkout@v4
      - name: install jq
        # jq ships on the ubuntu-latest image; only pay for apt if it is missing.
        run: command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
      - name: pin git default branch to main
        run: git config --global init.defaultBranch main
      - name: run hub-context tests
        run: |
          set -uo pipefail
          rc_all=0
          # Single source of truth, shared with scaffold-and-test's cross-check.
          while read -r name; do
            case "$name" in ''|\#*) continue ;; esac
            quarantined=0
            case "$name" in '!'*) quarantined=1; name="${name#!}" ;; esac
            t="templates/govern/test/$name.sh"
            if [ "$quarantined" -eq 1 ]; then
              echo "::warning::$name is QUARANTINED (known-broken on this runner) — not gating; see tools/hub-context-tests.txt"
              continue
            fi
            if [ ! -f "$t" ]; then
              echo "::error::$name listed in tools/hub-context-tests.txt but no such test file"
              rc_all=1; continue
            fi
            if bash "$t" >/tmp/out.log 2>&1; then
              echo "ok   - $name"
            else
              rc=$?
              if [ "$rc" -eq 77 ]; then
                echo "::error::$name SKIPPED (exit 77) — hub resolution is broken in the CI checkout"
              else
                echo "::error::$name FAILED (exit $rc)"
              fi
              sed 's/^/    /' /tmp/out.log
              rc_all=1
            fi
          done < tools/hub-context-tests.txt
          exit "$rc_all"

  scaffold-and-test:
    name: Govern suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # The suite is ~550s of wall clock and every test is self-contained (its own
    # mktemp workspace), so it is embarrassingly parallel. Sharding it turns the
    # long pole of this workflow into ~1/N of itself WITHOUT dropping a single
    # assertion. Cost is concentrated, not spread: the 25 slowest tests are 66%
    # of the runtime and the 71 fastest are 4.9%, so deleting tests is a bad
    # trade here and parallelism is a good one.
    # fail-fast: false so one red shard still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: install jq (some tests need it)
        # jq ships on the ubuntu-latest image; only pay for apt if it is missing.
        run: command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
      - name: pin git default branch to main
        # The GitHub Actions runner's git has no init.defaultBranch set, so `git init` (and
        # `git init --bare`) writes HEAD → master. Tests that push `main` from a seed clone
        # into that bare then re-clone hit "remote HEAD refers to nonexistent ref, unable to
        # checkout" and end up with an empty working tree — which then fails to source
        # scripts/lib/workspace.sh. macOS git already defaults to main (Homebrew + xcode-select
        # ship with it), which is why this only shows on Linux CI.
        run: git config --global init.defaultBranch main
      - name: create 2 fake sub-repos
        run: |
          set -euo pipefail
          WS="$RUNNER_TEMP/ws"
          mkdir -p "$WS"
          cd "$WS"
          for r in backend console; do
            mkdir "$r"
            ( cd "$r"
              git init -q
              printf '{"name":"%s","scripts":{"dev":"echo dev"}}\n' "$r" > package.json
              git -c user.email=ci@test -c user.name=ci add -A
              git -c user.email=ci@test -c user.name=ci commit -qm init )
          done
          echo "WS=$WS" >> "$GITHUB_ENV"
      - name: scaffold workspace (non-interactive)
        run: |
          set -euo pipefail
          bash scaffold.sh \
            --workspace-dir "$WS" \
            --pm npm \
            --org acme-ci \
            --repos "backend:3080:npm run dev,console:3000:npm run dev" \
            --merge-allowlist "backend" \
            --worktree-base "$WS.wt" \
            --git-init \
            --verify \
            --yes
      - name: run all govern tests in the scaffolded workspace
        # The suite is hub-only — scaffold.sh no longer installs it into a fleet
        # workspace — so copy it in here, exactly like sync-port.sh does for its
        # own scratch build.
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          SHARDS="${{ strategy.job-total }}"
          echo "shard $SHARD of $SHARDS"
          mkdir -p "$WS/scripts/govern/test"
          cp templates/govern/test/*.sh "$WS/scripts/govern/test/"
          chmod +x "$WS"/scripts/govern/test/*.sh
          cd "$WS"
          passed=0; failed=0; skipped=0; total=0
          fails=()
          skips=()
          # Build the run order: known-expensive tests first (scheduling hint from
          # tools/slow-tests-first.txt), then every remaining test alphabetically.
          # Round-robin over THAT order then packs the shards near-evenly, because
          # the cost is concentrated in a handful of tests. The hint can never drop
          # a test: stale entries are skipped and unlisted tests land in the tail,
          # so the built order is always the complete suite (asserted below).
          hint="$GITHUB_WORKSPACE/tools/slow-tests-first.txt"
          : > /tmp/order.txt
          if [ -f "$hint" ]; then
            while IFS= read -r n; do
              case "$n" in ''|\#*) continue ;; esac
              # NOT `[ -f x ] && printf`: under `set -e` a stale hint entry would
              # make that statement return 1 and abort the whole step.
              if [ -f "scripts/govern/test/$n.sh" ]; then
                printf '%s\n' "$n" >> /tmp/order.txt
              fi
            done < "$hint"
          fi
          for t in scripts/govern/test/test-*.sh; do
            n="$(basename "$t" .sh)"
            grep -qxF "$n" /tmp/order.txt || printf '%s\n' "$n" >> /tmp/order.txt
          done

          # The order MUST cover every test file exactly once, or a shard split
          # would silently drop coverage while CI stayed green.
          n_files="$(ls scripts/govern/test/test-*.sh | wc -l | tr -d ' ')"
          n_order="$(sort -u /tmp/order.txt | wc -l | tr -d ' ')"
          n_lines="$(wc -l < /tmp/order.txt | tr -d ' ')"
          if [ "$n_order" != "$n_files" ] || [ "$n_lines" != "$n_files" ]; then
            echo "::error::shard order covers $n_order unique / $n_lines lines but there are $n_files test files"
            exit 1
          fi
          echo "ok - shard order covers all $n_files tests"

          idx=0
          while IFS= read -r name; do
            idx=$((idx+1))
            [ "$(( (idx - 1) % SHARDS + 1 ))" -eq "$SHARD" ] || continue
            t="scripts/govern/test/$name.sh"
            total=$((total+1))
            if bash "$t" >/tmp/testout.log 2>&1; then
              passed=$((passed+1))
              echo "ok   - $name"
            else
              rc=$?
              if [ "$rc" -eq 77 ]; then
                skipped=$((skipped+1))
                skips+=("$name")
                echo "skip - $name (env not applicable)"
              else
                failed=$((failed+1))
                fails+=("$name")
                echo "FAIL - $name"
                sed 's/^/         /' /tmp/testout.log
              fi
            fi
          done < /tmp/order.txt
          echo ""
          echo "shard=$SHARD/$SHARDS  passed=$passed  failed=$failed  skipped=$skipped  total=$total"
          if [ "$failed" -gt 0 ]; then
            for f in "${fails[@]}"; do echo "::error::govern test failed: $f"; done
            exit 1
          fi

          # A test that skips HERE runs nowhere unless the hub-context-tests job picks it up.
          # That is how five update-channel tests sat ungated while CI looked green. Every skip
          # must be accounted for in tools/hub-context-tests.txt, or it is silently dead.
          unaccounted=0
          for s in ${skips[@]+"${skips[@]}"}; do
            # `!name` (quarantined) still counts as listed — strip the marker before matching.
            if ! sed 's/^!//' "$GITHUB_WORKSPACE/tools/hub-context-tests.txt" | grep -qxF "$s"; then
              echo "::error::$s skipped here and is NOT in tools/hub-context-tests.txt — it runs in NO job. Add it there (and confirm it passes from a hub checkout)."
              unaccounted=1
            fi
          done
          [ "$unaccounted" -eq 0 ] || exit 1
          echo "ok - all $skipped skip(s) are covered by the hub-context-tests job"
