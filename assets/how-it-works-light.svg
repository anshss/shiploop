<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="The shiploop governor loop">
  <style>
    .title { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub   { font: 400 10.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .lbl   { font: 400 10px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .mono  { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .monosub { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .box   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
    .ghost { fill: none; stroke: #b7c0c9; stroke-width: 1; stroke-dasharray: 4 3; }
    .halt  { fill: #fafbfc; stroke: #b7c0c9; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .acc   { fill: #f0f7ff; stroke: #0969da; stroke-width: 1.25; }
    .edge  { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .dash  { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .loop  { fill: none; stroke: #0969da; stroke-width: 1.75; }
    .looplbl { font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0969da; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8c959f"/>
    </marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- manual audit -->
  <rect class="ghost" x="666" y="8" width="210" height="34" rx="17"/>
  <text class="lbl" x="771" y="29" text-anchor="middle">manual audit · can halt</text>
  <path class="dash" d="M771 42 V62"/>

  <!-- main row -->
  <rect class="box" x="22" y="68" width="178" height="72" rx="10"/>
  <text class="mono" x="111" y="96" text-anchor="middle">queue/tickets.md</text>
  <text class="sub" x="111" y="114" text-anchor="middle">your backlog,</text>
  <text class="sub" x="111" y="128" text-anchor="middle">severity-ordered</text>

  <rect class="box" x="246" y="68" width="214" height="72" rx="10"/>
  <text class="title" x="353" y="96" text-anchor="middle">fresh headless worker</text>
  <text class="sub" x="353" y="114" text-anchor="middle">own git worktree</text>
  <text class="sub" x="353" y="128" text-anchor="middle">sonnet floor · opus on retry</text>

  <rect class="box" x="506" y="68" width="140" height="72" rx="10"/>
  <text class="title" x="576" y="100" text-anchor="middle">opens a PR</text>
  <text class="sub" x="576" y="118" text-anchor="middle">waits for CI</text>

  <rect class="box" x="692" y="68" width="158" height="72" rx="10"/>
  <text class="title" x="771" y="100" text-anchor="middle">merge guard</text>
  <text class="sub" x="771" y="118" text-anchor="middle">allowlist + three-factor</text>

  <path class="edge" d="M200 104 H240" marker-end="url(#a)"/>
  <path class="edge" d="M460 104 H500" marker-end="url(#a)"/>
  <path class="edge" d="M646 104 H686" marker-end="url(#a)"/>

  <!-- outcomes -->
  <path class="edge" d="M740 140 V158 Q740 164 734 164 H634 Q628 164 628 170 V194" marker-end="url(#a)"/>
  <text class="lbl" x="684" y="157" text-anchor="middle">green CI · on allowlist</text>
  <path class="edge" d="M802 140 V158 Q802 164 808 164 H823 Q829 164 829 170 V194" marker-end="url(#a)"/>
  <text class="lbl" x="848" y="184" text-anchor="start">otherwise</text>

  <rect class="box" x="548" y="200" width="160" height="60" rx="10"/>
  <text class="title" x="628" y="226" text-anchor="middle">✓ auto-merges</text>
  <text class="sub" x="628" y="244" text-anchor="middle">only its own PRs, never forks</text>

  <rect class="box" x="744" y="200" width="170" height="60" rx="10"/>
  <text class="title" x="829" y="226" text-anchor="middle">PR waits for you</text>
  <text class="sub" x="829" y="244" text-anchor="middle">pr-only, the default</text>

  <!-- escalation -->
  <path class="dash" d="M353 140 V194" marker-end="url(#a)"/>
  <rect class="halt" x="246" y="200" width="214" height="60" rx="10"/>
  <text class="title" x="353" y="226" text-anchor="middle">hard-stop → park + escalate</text>
  <text class="monosub" x="353" y="244" text-anchor="middle">governor/escalations.md</text>

  <!-- lesson channel -->
  <path class="edge" d="M628 260 V300" marker-end="url(#a)"/>
  <path class="edge" d="M829 260 V276 Q829 284 821 284 H672 Q664 284 664 292 V300" marker-end="url(#a)"/>

  <rect class="acc" x="356" y="306" width="308" height="60" rx="10"/>
  <text class="mono" x="510" y="332" text-anchor="middle">lesson → CLAUDE.md</text>
  <text class="sub" x="510" y="350" text-anchor="middle">memory you can read, diff, and edit</text>

  <!-- loop back -->
  <path class="loop" d="M356 336 H118 Q104 336 104 322 V146" marker-end="url(#b)"/>
  <text class="looplbl" x="237" y="328" text-anchor="middle">the next worker starts smarter</text>
</svg>
