# Model profile: the Claude family on Anthropic's own endpoint.
#
# A profile is DATA, never sourced or executed: every reader (the model-router mod, the govern
# scripts) parses KEY=value lines and strips the surrounding double quotes. One file per family;
# adding a family is adding one file here. No name from another family belongs in this file.
#
# A plain `claude` launch does NOT need this profile: with SHIPLOOP_MODEL_PROFILE unset the router
# passes every spawn through and the agent definitions' own model lines apply, which are these same
# tiers. Set SHIPLOOP_MODEL_PROFILE=claude only to pin each role to the exact id written here
# instead of the alias the definition carries.
FAMILY=claude

# What `claude --model` gets for the advisor's own session.
SESSION_MODEL="claude-opus-5-5"

# The /model lineup, highest first, |-separated. The launcher renders these rows into a
# modelPicker settings file; nothing in shiploop reads this key itself.
PICKER="claude-opus-5-5|claude-sonnet-5-5|claude-haiku-5-5"

# One model per shiploop role. The key is ROLE_ followed by the agent type with dashes as
# underscores (worker-retry reads ROLE_worker_retry). An agent type with no key here is not a
# shiploop role: the router leaves its spawn alone and it inherits the session's model.
ROLE_advisor="claude-opus-5-5"
ROLE_worker="claude-sonnet-5-5"
ROLE_worker_retry="claude-opus-5-5"
ROLE_investigator="claude-sonnet-5-5"
ROLE_lookup="claude-haiku-5-5"

# The roles highest first. This is the tier ladder for the family: nothing may spawn above the
# tier its own session sits at, and a rank is the model's first position on this list.
TIER_ORDER="advisor worker_retry investigator worker lookup"
